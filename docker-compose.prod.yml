services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - 8000
    env_file:
      - ./api/.flaskenv.prod
    restart: always
  nginx:
    build: ./nginx
    volumes:
      - static_volume:/app/staticfiles
      - ./ca:/etc/nginx/certs
    ports:
      - 80:80
      - 443:443
    depends_on:
      - api
    restart: always

volumes:
  static_volume:
